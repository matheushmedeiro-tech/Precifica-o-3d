<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Precificação 3D Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ebe2d0;
      --surface: rgba(255, 249, 239, 0.92);
      --ink: #1f2321;
      --muted: #5d625c;
      --accent: #0d766d;
      --accent-strong: #094742;
      --line: rgba(31, 35, 33, 0.1);
      --shadow: 0 24px 60px rgba(33, 35, 28, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "IBM Plex Sans", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(13, 118, 109, 0.18), transparent 26%),
        radial-gradient(circle at top right, rgba(214, 167, 104, 0.26), transparent 28%),
        linear-gradient(180deg, #f5ecdb 0%, #e8decb 100%);
    }

    .login-card {
      width: min(100%, 460px);
      padding: 28px;
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      margin: 0 0 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-strong);
      font-size: 0.75rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 0.95;
    }

    p {
      color: var(--muted);
    }

    form {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 0.93rem;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fffdf8;
      color: var(--ink);
      font: inherit;
    }

    input:focus {
      outline: none;
      border-color: rgba(13, 118, 109, 0.56);
      box-shadow: 0 0 0 4px rgba(13, 118, 109, 0.12);
    }

    button {
      min-height: 46px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #0d766d, #094742);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .error {
      min-height: 20px;
      color: #b42318;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <p class="eyebrow">Acesso protegido</p>
    <h1>Entrar no painel</h1>
    <p>Use seu usuário e senha para abrir o sistema de precificação.</p>

    <form id="loginForm">
      <label>
        <span>Usuário</span>
        <input id="username" name="username" type="text" autocomplete="username" required>
      </label>
      <label>
        <span>Senha</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <div id="loginError" class="error"></div>
      <button type="submit">Entrar</button>
    </form>
  </main>

  <script>
    const form = document.querySelector("#loginForm");
    const errorBox = document.querySelector("#loginError");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.textContent = "";

      const username = document.querySelector("#username").value.trim();
      const password = document.querySelector("#password").value;

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        if (!response.ok) {
          const payload = await response.json().catch(() => ({ error: "Falha no login." }));
          throw new Error(payload.error || "Falha no login.");
        }

        window.location.href = "/";
      } catch (error) {
        errorBox.textContent = error.message || "Não foi possível entrar.";
      }
    });
  </script>
</body>
</html>
